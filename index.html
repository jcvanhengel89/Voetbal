</head>
<body class="bg-slate-900 text-white h-screen w-full overflow-hidden">

    const TEAM_COLORS = [
        { id: 'blue',   bg: 'bg-blue-600',   text: 'text-blue-500',   border: 'border-blue-500' },
        { id: 'red',    bg: 'bg-red-600',    text: 'text-red-500',    border: 'border-red-500' },

        { id: 'black',  bg: 'bg-gray-800',   text: 'text-gray-400',   border: 'border-gray-600' },
        { id: 'white',  bg: 'bg-white',      text: 'text-gray-200',   border: 'border-white' },

    const INITIAL_PLAYERS = [
        { id: 1, name: 'Levi',     pos: 'k',  benchTime: 0, playTime: 0, benchCount: 0, goals: 0, present: true, posStats: { k:0, def:0, mid:0, att:0 } },
        { id: 2, name: 'Sem',      pos: 'lv', benchTime: 0, playTime: 0, benchCount: 0, goals: 0, present: true, posStats: { k:0, def:0, mid:0, att:0 } },
        { id: 3, name: 'Seff',     pos: 'rv', benchTime: 0, playTime: 0, benchCount: 0, goals: 0, present: true, posStats: { k:0, def:0, mid:0, att:0 } },
        { id: 4, name: 'Xavi',     pos: 'm',  benchTime: 0, playTime: 0, benchCount: 0, goals: 0, present: true, posStats: { k:0, def:0, mid:0, att:0 } },
        { id: 5, name: 'Tygo',     pos: 'la', benchTime: 0, playTime: 0, benchCount: 0, goals: 0, present: true, posStats: { k:0, def:0, mid:0, att:0 } },
        { id: 6, name: 'Yara',     pos: 'ra', benchTime: 0, playTime: 0, benchCount: 0, goals: 0, present: true, posStats: { k:0, def:0, mid:0, att:0 } },
        { id: 7, name: 'Mohamed',  pos: null, benchTime: 0, playTime: 0, benchCount: 0, goals: 0, present: true, posStats: { k:0, def:0, mid:0, att:0 } },
        { id: 8, name: 'Ali',      pos: null, benchTime: 0, playTime: 0, benchCount: 0, goals: 0, present: true, posStats: { k:0, def:0, mid:0, att:0 } },
        { id: 9, name: 'Yikshith', pos: null, benchTime: 0, playTime: 0, benchCount: 0, goals: 0, present: true, posStats: { k:0, def:0, mid:0, att:0 } },
    ];

    // --------------------------------------------------------------------
    // CUSTOM HOOKS
    // --------------------------------------------------------------------

    const useWakeLock = (active) => {
        const wakeLockRef = useRef(null);
        useEffect(() => {
            const requestLock = async () => {
                if ('wakeLock' in navigator && active) {
                    try {
                        wakeLockRef.current = await navigator.wakeLock.request('screen');
                    } catch (err) {
                        console.log('Wake Lock request failed:', err);
                    }
                }
            };
            const releaseLock = async () => {
                if (wakeLockRef.current) {
                    await wakeLockRef.current.release();
                    wakeLockRef.current = null;
                }
            };
            if (active) requestLock();
            else releaseLock();
            const handleVisChange = () => {
                if (document.visibilityState === 'visible' && active) requestLock();
            };
            document.addEventListener('visibilitychange', handleVisChange);
            return () => {
                releaseLock();
                document.removeEventListener('visibilitychange', handleVisChange);
            };
        }, [active]);
    };

    const useThrottledStorage = (key, initialValue, throttleMs = 5000) => {
        const [state, setState] = useState(() => {
            try {
                const item = localStorage.getItem(key);
                return item ? JSON.parse(item) : initialValue;
            } catch {
                return initialValue;
            }
        });
        const lastSaveRef = useRef(Date.now());
        const timeoutRef = useRef(null);
        const stateRef = useRef(state);

        useEffect(() => { stateRef.current = state; }, [state]);

        const saveNow = useCallback(() => {
            try {
                localStorage.setItem(key, JSON.stringify(stateRef.current));
                lastSaveRef.current = Date.now();
            } catch (e) { console.error("Storage save failed", e); }
        }, [key]);

        useEffect(() => {
            const now = Date.now();
            const timeSinceLastSave = now - lastSaveRef.current;
            if (timeSinceLastSave > throttleMs) {
                saveNow();
            } else {
                if (timeoutRef.current) clearTimeout(timeoutRef.current);
                timeoutRef.current = setTimeout(saveNow, throttleMs);
            }
            return () => { if (timeoutRef.current) clearTimeout(timeoutRef.current); };
        }, [state, throttleMs, saveNow]);

        useEffect(() => {
            const handleVisibilityChange = () => {
                if (document.visibilityState === 'hidden') saveNow();
            };
            document.addEventListener('visibilitychange', handleVisibilityChange);
            return () => document.removeEventListener('visibilitychange', handleVisibilityChange);
        }, [saveNow]);

        return [state, setState];
    };

    // --------------------------------------------------------------------
    // HELPERS & ICONS
    // --------------------------------------------------------------------
    
    const getFreshPlayers = () => JSON.parse(JSON.stringify(INITIAL_PLAYERS));
    const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    };
    const getInitials = (name) => (name ? name.substring(0, 2).toUpperCase() : '??');
    const getBench = (players) => players.filter(p => p.pos === null && p.present);
    const getField = (players) => players.filter(p => p.pos !== null && p.present);
    const getScorers = (players) => players.filter(p => p.goals > 0 && p.present);

    const Icon = ({ path, color = 'currentColor', size = 20, className = '' }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            {path}
        </svg>
    );

    const Icons = {
        Trophy: (p) => <Icon {...p} path={<><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></>} />,
        Clock: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>} />,
        RotateCcw: (p) => <Icon {...p} path={<><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></>} />,
        Save: (p) => <Icon {...p} path={<><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></>} />,
        Upload: (p) => <Icon {...p} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>} />,
        Settings: (p) => <Icon {...p} path={<><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>} />,
        Users: (p) => <Icon {...p} path={<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>} />,
        History: (p) => <Icon {...p} path={<><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></>} />,
        ClipboardCheck: (p) => <Icon {...p} path={<><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/><path d="M14 13.5l2 2 4-4"/></>} />,
        Play: (p) => <Icon {...p} path={<polygon points="5 3 19 12 5 21 5 3"/>} />,
        Pause: (p) => <Icon {...p} path={<><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></>} />,
        FastForward: (p) => <Icon {...p} path={<><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></>} />,
        Plus: (p) => <Icon {...p} path={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />,
        Minus: (p) => <Icon {...p} path={<line x1="5" y1="12" x2="19" y2="12"/>} />,
        X: (p) => <Icon {...p} path={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>} />,
        AlertTriangle: (p) => <Icon {...p} path={<><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>} />,
        Swords: (p) => <Icon {...p} path={<><polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/><line x1="13" y1="19" x2="19" y2="13"/><line x1="16" y1="16" x2="20" y2="20"/><line x1="19" y1="21" x2="21" y2="19"/><polyline points="14.5 6.5 18 3 21 3 21 6 17.5 9.5"/><line x1="5" y1="14" x2="9" y2="18"/><line x1="7" y1="17" x2="4" y2="20"/><line x1="3" y1="19" x2="5" y2="21"/></>} />,
        Palette: (p) => <Icon {...p} path={<><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></>} />,
        Layout: (p) => <Icon {...p} path={<><rect x="3" y="3" width="18" height="18" rx="2" ry="2" /><line x1="3" y1="9" x2="21" y2="9" /><line x1="9" y1="21" x2="9" y2="9" /></>} />,
    };

    // --------------------------------------------------------------------
    // COMPONENTEN
    // --------------------------------------------------------------------

    const PlayerToken = memo(({ name, initials, isSelected, goals, benchTime = 0, showBenchTimer = false }) => {
        let timerClass = 'bg-gray-800 border-gray-600 text-gray-300';
        if (benchTime > 300) {
            timerClass = 'bg-red-900 border-red-500 text-white animate-pulse';
        } else if (benchTime > 240) {
            timerClass = 'bg-orange-800 border-orange-500 text-white';
        }

        return (
            <div className={`relative flex flex-col items-center justify-center transition-transform duration-200 ${isSelected ? 'scale-110 z-50' : 'scale-100 z-10'}`}>
                <div className={`w-14 h-14 rounded-full flex items-center justify-center relative shadow-lg ${
                    isSelected
                        ? 'ring-4 ring-yellow-400 shadow-[0_0_20px_rgba(234,179,8,0.6)]'
                        : 'border-2 border-white/80'
                } bg-gradient-to-br from-red-500 to-red-800`}>
                    <span className="text-white font-black text-sm drop-shadow-md tracking-wider">{initials}</span>
                    {goals > 0 && (
                        <div className="absolute -top-2 -right-2 bg-yellow-400 text-black text-[10px] font-bold w-6 h-6 rounded-full flex items-center justify-center border-2 border-gray-900 shadow-md z-10">{goals}</div>
                    )}
                    {showBenchTimer && (
                        <div className={`absolute -bottom-3 px-2 py-0.5 rounded-md text-[10px] font-mono font-bold border shadow-md z-10 whitespace-nowrap ${timerClass}`}>{formatTime(benchTime)}</div>
                    )}
                </div>
                <div className="mt-2 bg-black/60 backdrop-blur-sm border border-white/10 rounded-full px-3 py-0.5 max-w-[80px] truncate text-center">
                    <span className="text-[10px] font-bold text-white">{name}</span>
                </div>
            </div>
        );
    });

    const FieldView = memo(({ players, selectedId, onSlotClick, formation }) => {
        const positions = FORMATIONS[formation].positions;

        return (
            <div className="absolute inset-0 p-4 flex items-center justify-center">
                <div className="w-full h-full max-w-md max-h-[800px] relative bg-emerald-900 rounded-xl border-4 border-white/10 shadow-inner overflow-hidden select-none">
                    <div className="absolute inset-0 opacity-30 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-emerald-600 via-transparent to-transparent"></div>
                    <div className="absolute inset-0" style={{ backgroundImage: 'repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.05) 40px)' }}></div>
                    <div className="absolute top-1/2 left-0 w-full h-0.5 bg-white/20"></div>
                    <div className="absolute top-1/2 left-1/2 w-24 h-24 border-2 border-white/20 rounded-full -translate-x-1/2 -translate-y-1/2"></div>
                    <div className="absolute top-0 left-1/2 w-32 h-16 border-2 border-t-0 border-white/20 -translate-x-1/2 rounded-b-lg"></div>
                    <div className="absolute bottom-0 left-1/2 w-32 h-16 border-2 border-b-0 border-white/20 -translate-x-1/2 rounded-t-lg"></div>

                    {Object.entries(positions).map(([key, coords]) => {
                        const player = players.find(p => p.pos === key && p.present);
                        const isSelected = player && player.id === selectedId;

                        return (
                            <div
                                key={key}
                                onClick={() => onSlotClick(player ? player.id : null, key)}
                                className="absolute w-20 h-20 -translate-x-1/2 -translate-y-1/2 z-10 flex items-center justify-center cursor-pointer touch-manipulation"
                                style={{ top: `${coords.top}%`, left: `${coords.left}%` }}
                            >
                                {player ? (
                                    <PlayerToken
                                        name={player.name}
                                        initials={getInitials(player.name)}
                                        goals={player.goals}
                                        isSelected={isSelected}
                                    />
                                ) : (
                                    <div className={`w-12 h-12 rounded-full border-2 border-dashed border-white/20 flex items-center justify-center transition-colors ${selectedId ? 'bg-yellow-500/20 border-yellow-400 animate-pulse' : 'hover:bg-white/5'}`}>
                                        <span className="text-[10px] font-bold text-white/30">{coords.label}</span>
                                    </div>
                                )}
                            </div>
                        );
                    })}
                </div>
            </div>
        );
    });

    const StatsView = memo(({ players, sortConfig, onChangeSort }) => {
        const sortedPlayers = useMemo(() => {
            const list = [...players].filter(p => p.present);
            if (!sortConfig.key) return list;
            return list.sort((a, b) => {
                if (sortConfig.key === 'name') {
                    return sortConfig.direction === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name);
                }
                const aVal = a[sortConfig.key];
                const bVal = b[sortConfig.key];
                if (aVal === bVal) return 0;
                const cmp = aVal > bVal ? 1 : -1;
                return sortConfig.direction === 'asc' ? cmp : -cmp;
            });
        }, [players, sortConfig]);

        return (
            <div className="absolute inset-0 overflow-y-auto p-4 max-w-md mx-auto">
                <h2 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Live Statistieken</h2>
                <div className="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden mb-4">
                    <table className="w-full text-sm text-left">
                        <thead className="bg-slate-900/50 text-slate-400 text-[10px] uppercase font-bold">
                            <tr>
                                <th className="p-3 pl-4 cursor-pointer" onClick={() => onChangeSort('name', 'asc')}>Naam</th>
                                <th className="p-3 text-center cursor-pointer" onClick={() => onChangeSort('goals', 'desc')}>Goal</th>
                                <th className="p-3 text-right cursor-pointer" onClick={() => onChangeSort('benchTime', 'desc')}>Bank</th>
                                <th className="p-3 pr-4 text-right cursor-pointer" onClick={() => onChangeSort('playTime', 'desc')}>Veld</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-700 text-white">
                            {sortedPlayers.map(p => {
                                const stats = p.posStats || { k:0, def:0, mid:0, att:0 };
                                const totalPosTime = stats.k + stats.def + stats.mid + stats.att;
                                
                                return (
                                <tr key={p.id} className="hover:bg-white/5">
                                    <td className="p-3 pl-4">
                                        <div className="font-medium">{p.name}</div>
                                        {/* Slimme toevoeging: Visuele heatmap van posities */}
                                        {totalPosTime > 0 && (
                                            <div className="flex w-full max-w-[80px] h-1 mt-1.5 rounded overflow-hidden bg-slate-700 opacity-80">
                                                {stats.k > 0 && <div style={{width: `${(stats.k/totalPosTime)*100}%`}} className="bg-yellow-500" title="Keeper" />}
                                                {stats.def > 0 && <div style={{width: `${(stats.def/totalPosTime)*100}%`}} className="bg-blue-500" title="Verdediging" />}
                                                {stats.mid > 0 && <div style={{width: `${(stats.mid/totalPosTime)*100}%`}} className="bg-green-500" title="Middenveld" />}
                                                {stats.att > 0 && <div style={{width: `${(stats.att/totalPosTime)*100}%`}} className="bg-red-500" title="Aanval" />}
                                            </div>
                                        )}
                                    </td>
                                    <td className={`text-center font-bold align-top pt-3 ${p.goals > 0 ? 'text-yellow-400' : ''}`}>{p.goals || '-'}</td>
                                    <td className={`text-right font-mono align-top pt-3 ${p.pos === null ? 'text-orange-400 font-bold' : ''}`}>{formatTime(p.benchTime)}</td>
                                    <td className="text-right pr-4 font-mono text-slate-400 align-top pt-3">{formatTime(p.playTime)}</td>
                                </tr>
                            )})}
                        </tbody>
                    </table>
                </div>
                
                {/* Legenda voor de heatmap */}
                <div className="flex gap-3 text-[10px] text-slate-400 justify-center">
                    <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-yellow-500"></span>Keeper</span>
                    <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-blue-500"></span>Verdediging</span>
                    <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-green-500"></span>Midden</span>
                    <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-red-500"></span>Aanval</span>
                </div>
            </div>
        );
    });

    const SetupView = memo(({ players, opponent, formation, onFormationChange, onOpponentNameChange, onOpponentColorChange, onRemovePlayer, onChangePlayerName, onTogglePresence, onCopyReport, onResetMatch, onFactoryReset, onAddPlayer, onExportData, onImportData }) => (
        <div className="absolute inset-0 overflow-y-auto p-4 max-w-md mx-auto bg-slate-900 z-20">
            <h2 className="text-lg font-bold mb-4 flex items-center gap-2 text-white">
                <Icons.Settings size={20} /> Instellingen
            </h2>
            <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-4 mb-6 text-white">
                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2"><Icons.Swords size={14} /> Wedstrijd Info</h3>
                <div className="space-y-4">
                    
                    <div>
                        <label className="text-xs text-slate-500 block mb-2 flex items-center gap-1">
                            <Icons.Layout size={12} /> Formatie
                        </label>
                        <div className="grid grid-cols-3 gap-2">
                            {Object.entries(FORMATIONS).map(([key, data]) => (
                                <button
                                    key={key}
                                    onClick={() => onFormationChange(key)}
                                    className={`py-2 px-1 rounded text-[10px] font-bold uppercase border transition-all ${
                                        formation === key
                                            ? 'bg-blue-600 border-blue-400 text-white shadow-lg'
                                            : 'bg-slate-900 border-slate-700 text-slate-500 hover:border-slate-500'
                                    }`}
                                >
                                    {key}
                                </button>
                            ))}
                        </div>
                        <p className="text-[10px] text-slate-500 mt-1 italic text-center">
                            {FORMATIONS[formation].label}
                        </p>
                    </div>

                    <div>
                        <label className="text-xs text-slate-500 block mb-1">Naam Tegenstander</label>
                        <input value={opponent.name} onChange={e => onOpponentNameChange(e.target.value)} className="w-full bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white focus:border-blue-500 outline-none" placeholder="Bijv. VV Katwijk" />
                    </div>
                    <div>
                        <label className="text-xs text-slate-500 block mb-2 flex items-center gap-1"><Icons.Palette size={12} /> Shirt Kleur</label>
                        <div className="flex gap-2 flex-wrap">
                            {TEAM_COLORS.map(c => (
                                <button key={c.id} onClick={() => onOpponentColorChange(c.id)} className={`w-8 h-8 rounded-full ${c.bg} border-2 ${opponent.colorId === c.id ? 'border-white scale-110 shadow-lg' : 'border-transparent opacity-50 hover:opacity-100'} transition-all`} title={c.id} />
                            ))}
                        </div>
                    </div>
                </div>
            </div>
            <div className="space-y-2 mb-6 text-white">
                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 flex items-center gap-2"><Icons.Users size={14} /> Spelers</h3>
                {players.map(p => (
                    <div key={p.id} className="bg-slate-800 border border-slate-700 p-2 rounded-lg flex items-center gap-2">
                        <button onClick={() => onRemovePlayer(p.id)} className="w-8 h-8 bg-red-900/20 text-red-500 rounded hover:bg-red-900 hover:text-white flex items-center justify-center transition-colors"><Icons.X size={16} /></button>
                        <input value={p.name} onChange={e => onChangePlayerName(p.id, e.target.value)} className="bg-transparent border-b border-slate-600 flex-1 px-2 py-1 focus:border-blue-500 outline-none text-white" />
                        <button onClick={() => onTogglePresence(p.id)} className={`text-[10px] font-bold px-3 py-1.5 rounded uppercase transition-colors ${p.present ? 'bg-emerald-600 text-white' : 'bg-slate-700 text-slate-500'}`}>{p.present ? 'Aanwezig' : 'Afwezig'}</button>
                    </div>
                ))}
                <button onClick={onAddPlayer} className="w-full py-3 border-2 border-dashed border-slate-700 text-slate-400 rounded-lg hover:border-slate-500 hover:text-white transition-colors flex items-center justify-center gap-2"><Icons.Plus size={16} /> Speler Toevoegen</button>
            </div>
            
            <div className="border-t border-slate-700 pt-4 space-y-3">
                <button onClick={onCopyReport} className="w-full bg-emerald-600 hover:bg-emerald-500 py-3 rounded-lg font-bold flex items-center justify-center gap-2 text-white"><Icons.ClipboardCheck size={18} /> Kopieer Verslag</button>
                <button onClick={onResetMatch} className="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-bold flex items-center justify-center gap-2 text-white"><Icons.RotateCcw size={18} /> Reset Huidige Wedstrijd</button>
                
                {/* Data Controle Opties */}
                <div className="flex gap-2">
                    <button onClick={onExportData} className="flex-1 bg-slate-700 hover:bg-slate-600 py-3 rounded-lg font-bold flex items-center justify-center gap-2 text-white text-[10px] uppercase">
                        <Icons.Save size={14} /> Backup
                    </button>
                    <label className="flex-1 bg-slate-700 hover:bg-slate-600 py-3 rounded-lg font-bold flex items-center justify-center gap-2 text-white text-[10px] uppercase cursor-pointer">
                        <Icons.Upload size={14} /> Laad in
                        <input type="file" accept=".json" onChange={onImportData} className="hidden" />
                    </label>
                </div>

                <button onClick={onFactoryReset} className="w-full text-red-500 py-2 text-xs flex items-center justify-center gap-1 mt-2"><Icons.AlertTriangle size={12} /> Alles Wissen</button>
            </div>
        </div>
    ));

    const ConfettiExplosion = memo(() => {
        const particles = useMemo(() => Array.from({ length: 50 }).map((_, i) => ({
            id: i,
            left: Math.random() * 100 + '%',
            bg: ['#EF4444', '#3B82F6', '#EAB308', '#22C55E', '#FFFFFF'][Math.floor(Math.random() * 5)],
            delay: Math.random() * 0.5 + 's',
            duration: (Math.random() * 1 + 2) + 's',
            rotation: Math.random() * 360 + 'deg',
        })), []);
        return (
            <div className="absolute inset-0 pointer-events-none overflow-hidden z-[100]">
                {particles.map(p => (
                    <div key={p.id} className="absolute w-2 h-2 rounded-sm" style={{ left: p.left, top: '-20px', backgroundColor: p.bg, animation: `fall ${p.duration} linear forwards`, animationDelay: p.delay, transform: `rotate(${p.rotation})` }} />
                ))}
            </div>
        );
    });

    // --------------------------------------------------------------------
    // HOOFDAPP
    // --------------------------------------------------------------------

    function App() {
        // STATE -----------------------------------------------------------
        const [players, setPlayers] = useThrottledStorage(`${STORAGE_VERSION}_players`, getFreshPlayers(), 5000);
        const [timer, setTimer] = useThrottledStorage(`${STORAGE_VERSION}_timer`, 0, 5000);
        const [history, setHistory] = useThrottledStorage(`${STORAGE_VERSION}_history`, [], 5000);
        const [score, setScore] = useThrottledStorage(`${STORAGE_VERSION}_score`, { home: 0, away: 0 }, 5000);
        const [quarter, setQuarter] = useThrottledStorage(`${STORAGE_VERSION}_quarter`, 1, 5000);
        const [formation, setFormation] = useThrottledStorage(`${STORAGE_VERSION}_formation`, '6v6', 5000);
        
        const [archive, setArchive] = useState(() => { try { return JSON.parse(localStorage.getItem(`${STORAGE_VERSION}_archive`) || '[]'); } catch { return []; }});
        const [opponent, setOpponent] = useState(() => { try { return JSON.parse(localStorage.getItem(`${STORAGE_VERSION}_opponent`) || JSON.stringify({ name: 'Tegenstander', colorId: 'blue' })); } catch { return { name: 'Tegenstander', colorId: 'blue' }; }});

        const [isRunning, setIsRunning] = useState(false);
        const [selectedId, setSelectedId] = useState(null);
        const [view, setView] = useState('field');
        const [sortConfig, setSortConfig] = useState({ key: 'id', direction: 'asc' });

        const [showGoalModal, setShowGoalModal] = useState(false);
        const [showUndoGoalModal, setShowUndoGoalModal] = useState(false);
        const [showEndModal, setShowEndModal] = useState(false);
        const [showConfetti, setShowConfetti] = useState(false);

        useWakeLock(isRunning);

        useEffect(() => localStorage.setItem(`${STORAGE_VERSION}_archive`, JSON.stringify(archive)), [archive]);
        useEffect(() => localStorage.setItem(`${STORAGE_VERSION}_opponent`, JSON.stringify(opponent)), [opponent]);

        const safeOpponent = opponent || { name: 'Tegenstander', colorId: 'blue' };
        const oppColor = TEAM_COLORS.find(c => c.id === safeOpponent.colorId) || TEAM_COLORS[0];
        
        const currentPositions = FORMATIONS[formation].positions;

        // CALLBACKS
        const handleOpponentNameChange = useCallback((n) => setOpponent(o => ({ ...o, name: n })), [setOpponent]);
        const handleOpponentColorChange = useCallback((c) => setOpponent(o => ({ ...o, colorId: c })), [setOpponent]);
        const handleRemovePlayer = useCallback((id) => confirm('Wissen?') && setPlayers(curr => curr.filter(p => p.id !== id)), [setPlayers]);
        const handleChangePlayerName = useCallback((id, n) => setPlayers(curr => curr.map(p => p.id === id ? { ...p, name: n } : p)), [setPlayers]);
        const handleTogglePresence = useCallback((id) => setPlayers(curr => curr.map(p => p.id === id ? { ...p, present: !p.present, pos: !p.present ? p.pos : null } : p)), [setPlayers]);
        const handleAddPlayer = useCallback(() => setPlayers(curr => [...curr, { id: Date.now(), name: 'Nieuw', pos: null, benchTime: 0, playTime: 0, benchCount: 0, goals: 0, present: true, posStats: {k:0,def:0,mid:0,att:0} }]), [setPlayers]);
        
        const handleFormationChange = useCallback((newFormat) => {
            setFormation(newFormat);
            const newPositions = FORMATIONS[newFormat].positions;
            setPlayers(curr => curr.map(p => {
                if (p.pos && !newPositions[p.pos]) {
                    return { ...p, pos: null };
                }
                return p;
            }));
        }, [setFormation, setPlayers]);

        // Export/Import Logica voor controle over eigen data
        const handleExportData = useCallback(() => {
            const backupData = {
                version: STORAGE_VERSION,
                date: new Date().toISOString(),
                data: { players, archive, opponent, history, score, quarter, formation }
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `coach_app_backup_${new Date().toLocaleDateString('nl-NL')}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }, [players, archive, opponent, history, score, quarter, formation]);

        const handleImportData = useCallback((e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (imported && imported.data) {
                        if (confirm('Let op: Dit overschrijft je huidige status met de data uit de backup. Doorgaan?')) {
                            if (imported.data.players) setPlayers(imported.data.players);
                            if (imported.data.archive) setArchive(imported.data.archive);
                            if (imported.data.opponent) setOpponent(imported.data.opponent);
                            if (imported.data.history) setHistory(imported.data.history);
                            if (imported.data.score) setScore(imported.data.score);
                            if (imported.data.quarter) setQuarter(imported.data.quarter);
                            if (imported.data.formation) setFormation(imported.data.formation);
                            alert("Backup succesvol hersteld!");
                        }
                    } else {
                        alert("Ongeldig backup bestand (verkeerd formaat).");
                    }
                } catch (err) {
                    alert("Fout bij het inladen van bestand.");
                }
            };
            reader.readAsText(file);
        }, [setPlayers, setArchive, setOpponent, setHistory, setScore, setQuarter, setFormation]);


        // LOGIC -----------------------------------------------------------

        const handleInteraction = useCallback((targetId, targetPos = null) => {
            if (selectedId === null) {
                if (targetId) setSelectedId(targetId);
                return;
            }
            if (selectedId === targetId) {
                setSelectedId(null);
                return;
            }

            setPlayers(currentPlayers => {
                const p1Idx = currentPlayers.findIndex(p => p.id === selectedId);
                if (p1Idx === -1) return currentPlayers;

                const newPlayers = [...currentPlayers];
                if (!targetId && targetPos) {
                    newPlayers[p1Idx] = { ...newPlayers[p1Idx], pos: targetPos };
                    return newPlayers;
                }

                const p2Idx = currentPlayers.findIndex(p => p.id === targetId);
                if (p2Idx === -1) return currentPlayers;

                const p1 = newPlayers[p1Idx];
                const p2 = newPlayers[p2Idx];

                const tmpPos = p1.pos;
                newPlayers[p1Idx] = { ...p1, pos: p2.pos };
                newPlayers[p2Idx] = { ...p2, pos: tmpPos };
                
                return newPlayers;
            });

            const p1 = players.find(p => p.id === selectedId);
            const p2 = players.find(p => p.id === targetId);
            
            if (p1 && p2 && ((p1.pos === null && p2.pos !== null) || (p1.pos !== null && p2.pos === null))) {
                 if (isRunning || quarter > 1) { 
                    const outP = p1.pos !== null ? p1 : p2;
                    const inP = p1.pos === null ? p1 : p2;
                    setHistory(h => [{ id: Date.now(), time: formatTime(timer), q: quarter, in: inP.name, out: outP.name }, ...h]);
                    setPlayers(curr => curr.map(p => p.id === outP.id ? { ...p, benchCount: p.benchCount + 1 } : p));
                 }
            } else if (!targetId && targetPos) {
                setSelectedId(null);
                return;
            }
            setSelectedId(null);
        }, [selectedId, players, isRunning, quarter, timer, setPlayers, setHistory]);

        useEffect(() => {
            if (!isRunning) return;
            const interval = setInterval(() => {
                setTimer(t => t + 1);
                setPlayers(curr => curr.map(p => {
                    if (!p.present) return p;
                    if (p.pos === null) return { ...p, benchTime: p.benchTime + 1 };
                    
                    const posInfo = currentPositions[p.pos];
                    if (!posInfo) return p;

                    const posType = posInfo.type || 'mid';
                    const stats = p.posStats || { k:0, def:0, mid:0, att:0 };
                    return { 
                        ...p, 
                        playTime: p.playTime + 1,
                        posStats: { ...stats, [posType]: stats[posType] + 1 }
                    };
                }));
            }, 1000);
            return () => clearInterval(interval);
        }, [isRunning, setTimer, setPlayers, currentPositions]);

        useEffect(() => {
            if (showConfetti) {
                const t = setTimeout(() => setShowConfetti(false), 3000);
                return () => clearTimeout(t);
            }
        }, [showConfetti]);

        const toggleTimer = useCallback(() => {
            if (!isRunning && timer === 0 && quarter === 1) {
                setPlayers(prev => prev.map(p => p.pos === null && p.present ? { ...p, benchCount: p.benchCount + 1 } : p));
            }
            setIsRunning(prev => !prev);
        }, [isRunning, timer, quarter, setPlayers]);

        const registerGoal = (playerId) => {
            setScore(s => ({ ...s, home: s.home + 1 }));
            if (playerId) setPlayers(curr => curr.map(p => p.id === playerId ? { ...p, goals: p.goals + 1 } : p));
            setShowGoalModal(false);
            setShowConfetti(true);
        };

        const removeGoal = (playerId) => {
            setScore(s => ({ ...s, home: Math.max(0, s.home - 1) }));
            if (playerId) setPlayers(curr => curr.map(p => p.id === playerId ? { ...p, goals: Math.max(0, p.goals - 1) } : p));
            setShowUndoGoalModal(false);
        };

        const copyReport = () => {
            let resultText = 'Gelijkspel 🤝';
            if (score.home > score.away) resultText = 'Winst! 🏆';
            else if (score.home < score.away) resultText = 'Helaas..';
            const scorers = getScorers(players).map(p => `${p.name} (${p.goals}x)`).join(', ');
            const report = `⚽ *WEDSTRIJDVERSLAG JO9-10* ⚽\n\n🆚 Tegen: ${safeOpponent.name}\n📊 *Eindstand:* ${score.home} - ${score.away} (${resultText})\n\n🎯 *Doelpunten:* ${scorers || 'Geen'}\n\nToppers! 💪`;
            navigator.clipboard.writeText(report).then(() => alert('Gekopieerd!')).catch(() => prompt('Kopieer handmatig:', report));
        };

        const performReset = useCallback(() => {
            setIsRunning(false);
            setScore({ home: 0, away: 0 });
            setTimer(0);
            setQuarter(1);
            setHistory([]);
            setOpponent({ name: 'Tegenstander', colorId: 'blue' }); 
            setPlayers(curr => curr.map(p => ({ 
                ...p, 
                goals: 0, 
                benchTime: 0, 
                playTime: 0, 
                benchCount: 0, 
                posStats: { k:0, def:0, mid:0, att:0 } 
            })));
            setSelectedId(null);
        }, [setPlayers, setScore, setTimer, setQuarter, setHistory, setOpponent]);

        const resetMatch = () => {
            if (!confirm('⚠ Let op: Je wist hiermee ALLES van DEZE wedstrijd (ook tegenstander). Historie blijft bewaard.')) return;
            performReset();
        };

        const factoryReset = () => {
            if (!confirm('☠️ FABRIEKSINSTELLINGEN ☠️\n\nWeet je het zeker?')) return;
            localStorage.clear();
            location.reload(); 
        };
        
        const archiveMatch = () => {
             if (!confirm('💾 Wedstrijd opslaan in archief en resetten?')) return;
             const matchData = {
                id: Date.now(),
                date: new Date().toLocaleDateString('nl-NL'),
                opponent: safeOpponent.name,
                score,
                colorId: safeOpponent.colorId,
                playerStats: players.map(p => ({ name: p.name, goals: p.goals, playTime: p.playTime, posStats: p.posStats }))
            };
            setArchive(prev => [matchData, ...prev]);
            performReset(); 
            setShowEndModal(false);
            setView('season');
        };

        const benchPlayers = getBench(players);

        return (
            <div className="flex flex-col h-full w-full max-w-md mx-auto relative bg-slate-900 shadow-2xl">
                {showConfetti && <ConfettiExplosion />}

                {/* MODALS */}
                {(showGoalModal || showUndoGoalModal || showEndModal) && (
                    <div className="absolute inset-0 z-[60] bg-black/80 flex items-center justify-center p-4 backdrop-blur-sm animate-[fadeIn_0.2s]">
                        <div className="bg-slate-800 border border-slate-600 rounded-2xl shadow-2xl w-full p-6">
                            {showGoalModal && (
                                <>
                                    <h3 className="text-3xl font-black text-center mb-6 text-green-400 uppercase tracking-wider font-mono">Goal! ⚽</h3>
                                    <div className="grid grid-cols-2 gap-3 mb-4 max-h-[50vh] overflow-y-auto">
                                        {getField(players).map(p => (
                                            <button key={p.id} onClick={() => registerGoal(p.id)} className="bg-green-600 hover:bg-green-500 text-white font-bold py-4 rounded-xl border-b-4 border-green-800 active:translate-y-1 transition-all">{p.name}</button>
                                        ))}
                                    </div>
                                    <button onClick={() => registerGoal(null)} className="w-full bg-slate-700 py-3 rounded-lg font-bold mb-2 text-white">Overig / Eigen Goal</button>
                                    <button onClick={() => setShowGoalModal(false)} className="w-full text-gray-400 text-sm py-2">Annuleren</button>
                                </>
                            )}
                            {showUndoGoalModal && (
                                <>
                                    <h3 className="text-xl font-bold text-center mb-4 text-red-400">Goal Correctie</h3>
                                    <div className="grid grid-cols-2 gap-3 mb-4">
                                        {getScorers(players).map(p => (
                                            <button key={p.id} onClick={() => removeGoal(p.id)} className="bg-red-600 hover:bg-red-500 text-white py-3 rounded-xl font-bold">{p.name} ({p.goals})</button>
                                        ))}
                                    </div>
                                    <button onClick={() => removeGoal(null)} className="w-full bg-slate-700 py-3 rounded-lg font-bold mb-2 text-white">Overig</button>
                                    <button onClick={() => setShowUndoGoalModal(false)} className="w-full text-gray-400 text-sm py-2">Annuleren</button>
                                </>
                            )}
                            {showEndModal && (
                                <div className="text-center text-white">
                                    <h2 className="text-2xl font-black text-yellow-400 mb-2 uppercase">Wedstrijd Einde</h2>
                                    <div className="text-lg text-slate-400 mb-4">vs {safeOpponent.name}</div>
                                    <div className="text-6xl font-mono font-bold mb-8 tracking-widest bg-black/30 rounded-xl py-4">{score.home} - {score.away}</div>
                                    <button onClick={copyReport} className="w-full py-4 bg-green-600 rounded-xl font-bold shadow-lg mb-3 flex items-center justify-center gap-2 text-lg hover:bg-green-500"><Icons.ClipboardCheck /> Verslag Kopiëren</button>
                                    <button onClick={archiveMatch} className="w-full py-4 bg-blue-600 rounded-xl font-bold shadow-lg mb-3 flex items-center justify-center gap-2 text-lg hover:bg-blue-500"><Icons.Save /> Opslaan & Archiveren</button>
                                    <button onClick={() => setShowEndModal(false)} className="w-full py-3 bg-slate-700 rounded-lg text-gray-300">Terug</button>
                                </div>
                            )}
                        </div>
                    </div>
                )}

                {/* TOPBAR */}
                <div className="flex-none h-20 bg-slate-900/95 backdrop-blur-md border-b border-white/10 flex items-center justify-between px-4 z-50">
                    <div className="flex flex-col w-20">
                        <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Kwart {quarter}</span>
                        <div className={`text-2xl font-mono font-bold leading-none ${timer >= 600 ? 'text-red-500 animate-pulse' : 'text-white'}`}>{formatTime(timer)}</div>
                    </div>
                    <div className="flex-1 flex flex-col items-center justify-center">
                        <div className="flex items-center bg-black/40 rounded-full border border-white/10 px-2 py-1">
                            <div className="flex items-center gap-1">
                                <button onClick={() => score.home > 0 && setShowUndoGoalModal(true)} className="w-8 h-8 rounded-full bg-red-900/30 text-red-400 flex items-center justify-center font-bold active:scale-90 transition-transform"><Icons.Minus size={14} /></button>
                                <span className="w-8 text-center text-2xl font-black text-red-500 font-mono">{score.home}</span>
                                <button onClick={() => setShowGoalModal(true)} className="w-8 h-8 rounded-full bg-red-600 text-white flex items-center justify-center font-bold shadow active:scale-90 transition-transform"><Icons.Plus size={16} /></button>
                            </div>
                            <span className="text-slate-600 mx-2 text-xl">:</span>
                            <div className="flex items-center gap-1">
                                <button onClick={() => setScore(s => ({ ...s, away: Math.max(0, s.away - 1) }))} className={`w-8 h-8 rounded-full ${oppColor.bg}/20 ${oppColor.text} flex items-center justify-center font-bold active:scale-90 transition-transform`}><Icons.Minus size={14} /></button>
                                <span className={`w-8 text-center text-2xl font-black ${oppColor.text} font-mono`}>{score.away}</span>
                                <button onClick={() => setScore(s => ({ ...s, away: s.away + 1 }))} className={`w-8 h-8 rounded-full ${oppColor.bg} text-white flex items-center justify-center font-bold shadow active:scale-90 transition-transform`}><Icons.Plus size={16} /></button>
                            </div>
                        </div>
                        <div className="mt-1 text-[10px] text-slate-400 font-semibold truncate max-w-[220px] text-center">vv Nieuwerkerk <span className="text-slate-600 mx-1">vs</span> {safeOpponent.name}</div>
                    </div>
                    <div className="w-20 flex justify-end">
                        <button onClick={() => setView(prev => (prev === 'setup' ? 'field' : 'setup'))} className="p-2 bg-slate-800 rounded-lg text-slate-300 border border-slate-700 hover:text-white"><Icons.Settings size={20} /></button>
                    </div>
                </div>

                {/* MAIN CONTENT */}
                <div className="flex-1 relative overflow-hidden bg-slate-900 w-full">
                    {view === 'field' && <FieldView players={players} selectedId={selectedId} onSlotClick={handleInteraction} formation={formation} />}
                    {view === 'stats' && <StatsView players={players} sortConfig={sortConfig} onChangeSort={setSortConfig} />}
                    
                    {view === 'log' && (
                        <div className="absolute inset-0 overflow-y-auto p-4 max-w-md mx-auto">
                             <h2 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Log</h2>
                             <div className="space-y-2">{history.map(h => (
                                <div key={h.id} className="bg-slate-800 border border-slate-700 p-3 rounded-lg flex justify-between items-center text-white">
                                    <span className="text-xs font-mono text-slate-500 bg-slate-900 px-2 py-1 rounded">Q{h.q} {h.time}</span>
                                    <div className="text-sm"><span className="text-red-400 font-bold">{h.out}</span> ➜ <span className="text-green-400 font-bold">{h.in}</span></div>
                                </div>
                             ))}</div>
                        </div>
                    )}
                    
                    {view === 'season' && (
                         <div className="absolute inset-0 overflow-y-auto p-4 max-w-md mx-auto">
                            <h2 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Archief ({archive.length})</h2>
                            <div className="space-y-2">
                                {archive.map(m => (
                                    <div key={m.id} className="bg-slate-800 p-3 rounded flex flex-col gap-1 border border-slate-700">
                                        <div className="flex justify-between items-center"><span className="text-slate-400 text-xs">{m.date}</span><span className="text-xs font-bold text-white">vs {m.opponent}</span></div>
                                        <span className="font-mono font-bold text-white bg-slate-900 px-2 py-0.5 rounded border border-slate-700 self-end mt-1">{m.score.home} - {m.score.away}</span>
                                    </div>
                                ))}
                            </div>
                         </div>
                    )}

                    {view === 'setup' && (
                        <SetupView
                            players={players}
                            opponent={safeOpponent}
                            formation={formation}
                            onFormationChange={handleFormationChange}
                            onOpponentNameChange={handleOpponentNameChange}
                            onOpponentColorChange={handleOpponentColorChange}
                            onRemovePlayer={handleRemovePlayer}
                            onChangePlayerName={handleChangePlayerName}
                            onTogglePresence={handleTogglePresence}
                            onAddPlayer={handleAddPlayer}
                            onCopyReport={copyReport}
                            onResetMatch={resetMatch}
                            onFactoryReset={factoryReset}
                            onExportData={handleExportData}
                            onImportData={handleImportData}
                        />
                    )}
                </div>

                {/* FOOTER */}
                <div className="flex-none bg-slate-900 border-t border-white/10 pb-safe z-50">
                    {view !== 'setup' && (
                        <>
                            <div className="flex border-b border-white/5">
                                {[{ id: 'field', label: 'Veld', icon: Icons.Trophy }, { id: 'stats', label: 'Stats', icon: Icons.ClipboardCheck }, { id: 'log', label: 'Log', icon: Icons.Clock }, { id: 'season', label: 'Seizoen', icon: Icons.History }].map(tab => (
                                    <button key={tab.id} onClick={() => setView(tab.id)} className={`flex-1 py-3 flex flex-col items-center justify-center gap-1 transition-colors ${view === tab.id ? 'text-blue-400 bg-white/5 border-b-2 border-blue-500' : 'text-slate-500 hover:text-slate-300'}`}>
                                        <tab.icon size={16} /><span className="text-[9px] font-bold uppercase tracking-widest">{tab.label}</span>
                                    </button>
                                ))}
                            </div>
                            <div className="p-3 pb-6">
                                {view === 'season' ? (
                                    <div className="text-center text-xs text-slate-500 py-4 italic">Archief modus</div>
                                ) : (
                                    <>
                                        <div className="mb-2 px-1 flex justify-between items-end">
                                            <span className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Wisselbank ({benchPlayers.length})</span>
                                        </div>
                                        <div className="flex gap-4 overflow-x-auto pb-4 scrollbar-hide min-h-[80px]">
                                            {benchPlayers.length > 0 ? benchPlayers.map(p => (
                                                <div key={p.id} onClick={() => handleInteraction(p.id)} className="flex-shrink-0 cursor-pointer">
                                                    <PlayerToken name={p.name} initials={getInitials(p.name)} goals={p.goals} isSelected={p.id === selectedId} benchTime={p.benchTime} showBenchTimer />
                                                </div>
                                            )) : <div className="w-full text-center text-slate-600 text-xs py-4 italic border border-dashed border-slate-700 rounded-lg">Iedereen speelt!</div>}
                                        </div>
                                        <div className="flex gap-3 mt-1">
                                            <button onClick={toggleTimer} className={`flex-1 py-3.5 rounded-xl font-bold text-sm shadow-lg flex items-center justify-center gap-2 transform active:scale-95 transition-all ${isRunning ? 'bg-amber-600 text-white hover:bg-amber-500' : 'bg-emerald-600 text-white hover:bg-emerald-500'}`}>
                                                {isRunning ? <><Icons.Pause size={18} /> PAUZE</> : <><Icons.Play size={18} /> START</>}
                                            </button>
                                            <button onClick={() => quarter === 4 ? confirm('Einde wedstrijd?') && setShowEndModal(true) : confirm('Volgend kwart?') && (setQuarter(q => q + 1), setTimer(0), setIsRunning(false))} className={`px-5 py-3 rounded-xl font-bold text-[10px] shadow-lg flex flex-col items-center justify-center leading-none transform active:scale-95 transition-all ${quarter === 4 ? 'bg-red-600 hover:bg-red-500 animate-pulse' : 'bg-slate-700 hover:bg-slate-600'} text-white`}>
                                                {quarter === 4 ? <span className="text-xs">EINDE</span> : <><span className="mb-0.5"><Icons.FastForward size={14} /></span>KWART</>}
                                            </button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </>
                    )}
                </div>
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>
</body>
</html>
