<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Coach App JO9-10</title>
    <!-- Aangepast naar een zachte lichte kleur -->
    <meta name="theme-color" content="#f8fafc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- Default status bar zorgt voor donkere tekst op lichte achtergrond op iOS -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <style>
        /* Rustige, lichte achtergrondkleur om flitsen te voorkomen */
        html, body {
            background-color: #f8fafc;
            overscroll-behavior-y: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        .animate-pulse-slow {
            animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen w-full overflow-hidden">
    
<!-- Prikkelarme laad-indicator -->
<div id="root" class="h-full w-full flex items-center justify-center">
    <div class="text-slate-400 font-mono text-sm animate-pulse-slow flex flex-col items-center gap-3">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="animate-spin text-slate-300"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        Overzicht laden...
    </div>
</div>

<!-- Vangnet aangepast naar het lichte thema -->
<script>
    window.addEventListener('error', function(event) {
        const root = document.getElementById('root');
        if (root) {
            root.innerHTML = '<div style="padding: 24px; padding-top: calc(env(safe-area-inset-top) + 24px); color: #dc2626; font-family: monospace; font-size: 13px; word-wrap: break-word; background-color: #f8fafc; height: 100vh;">' +
                '<h3 style="font-weight: bold; font-size: 16px; margin-bottom: 8px;">Systeemfout</h3>' + 
                (event.message || 'Onbekende fout bij inladen scripts.') + '<br/><br/>' +
                '<span style="color: #64748b;">Bestand: ' + (event.filename || 'onbekend') + '</span><br/>' +
                '<span style="color: #64748b;">Regel: ' + (event.lineno || '?') + '</span>' +
                '<div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #e2e8f0;">' +
                '<p style="color: #64748b; margin-bottom: 15px;">Mogelijk zit er corrupte data in het geheugen. Gebruik de knop hieronder om de opslag te forceren en schoon te beginnen.</p>' +
                '<button onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload();" style="padding: 12px 20px; background: #ef4444; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; width: 100%;">Forceer Reset (Wis Lokale Data)</button>' +
                '</div></div>';
        }
    });
</script>

    // --------------------------------------------------------------------
    // CUSTOM HOOKS

    const useWakeLock = (active) => {
        const wakeLockRef = useRef(null);
        useEffect(() => {
            const requestLock = async () => {
                if ('wakeLock' in navigator && active) {
                    try {
                        wakeLockRef.current = await navigator.wakeLock.request('screen');
                    } catch (err) {
                        console.log('Wake Lock request failed:', err);
                    }
                }
            };
            const releaseLock = async () => {
                if (wakeLockRef.current) {
                    await wakeLockRef.current.release();
                    wakeLockRef.current = null;
                }
            };
            if (active) requestLock();
            else releaseLock();
            const handleVisChange = () => {
                if (document.visibilityState === 'visible' && active) requestLock();
            };
            document.addEventListener('visibilitychange', handleVisChange);
            return () => {
                releaseLock();
                document.removeEventListener('visibilitychange', handleVisChange);
            };
        }, [active]);
    };

    const useThrottledStorage = (key, initialValue, throttleMs = 5000) => {
        const [state, setState] = useState(() => {
            try {
                const item = localStorage.getItem(key);
                return item ? JSON.parse(item) : initialValue;
            } catch {
                return initialValue;
            }
        });
        const lastSaveRef = useRef(Date.now());
        const timeoutRef = useRef(null);
        const stateRef = useRef(state);

        useEffect(() => { stateRef.current = state; }, [state]);

        const saveNow = useCallback(() => {
            try {
                localStorage.setItem(key, JSON.stringify(stateRef.current));
                lastSaveRef.current = Date.now();
            } catch (e) { console.error("Storage save failed", e); }
        }, [key]);

        useEffect(() => {
            const now = Date.now();
            const timeSinceLastSave = now - lastSaveRef.current;
            if (timeSinceLastSave > throttleMs) {
                saveNow();
            } else {
                if (timeoutRef.current) clearTimeout(timeoutRef.current);
                timeoutRef.current = setTimeout(saveNow, throttleMs);
            }
            return () => { if (timeoutRef.current) clearTimeout(timeoutRef.current); };
        }, [state, throttleMs, saveNow]);

        useEffect(() => {
            const handleVisibilityChange = () => {
                if (document.visibilityState === 'hidden') saveNow();
            };
            document.addEventListener('visibilitychange', handleVisibilityChange);
            return () => document.removeEventListener('visibilitychange', handleVisibilityChange);
        }, [saveNow]);

        return [state, setState];
    };

    // --------------------------------------------------------------------

    const formatTime = (seconds) => {

    const getInitials = (name) => (name ? name.substring(0, 2).toUpperCase() : '??');
    const getBench = (players) => players.filter(p => p.pos === null && p.present);
    const getField = (players) => players.filter(p => p.pos !== null && p.present);

    const Icon = ({ path, color = 'currentColor', size = 20, className = '' }) => (

    const Icons = {
        Trophy: (p) => <Icon {...p} path={<><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></>} />,

        ClipboardCheck: (p) => <Icon {...p} path={<><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/><path d="M14 13.5l2 2 4-4"/></>} />,

        AlertTriangle: (p) => <Icon {...p} path={<><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>} />,

    // --------------------------------------------------------------------

    const PlayerToken = memo(({ name, initials, isSelected, goals, benchTime = 0, showBenchTimer = false, role = null }) => {
        let timerClass = 'bg-white text-slate-600 border-slate-200';
        if (benchTime > 300) {
            timerClass = 'bg-red-50 text-red-600 border-red-200 animate-pulse';
        } else if (benchTime > 240) {
            timerClass = 'bg-orange-50 text-orange-600 border-orange-200';
        }

        // Bepaal de kleuren op basis van selectie en veld-rol
        let tokenBg = 'bg-white';
        let tokenBorder = 'border-slate-400 shadow-sm';
        let tokenText = 'text-slate-700';

        if (isSelected) {
            tokenBg = 'bg-indigo-50';
            tokenBorder = 'border-indigo-400 ring-4 ring-indigo-100';
            tokenText = 'text-indigo-700';
        } else if (role === 'k') {
            tokenBg = 'bg-amber-100';
            tokenBorder = 'border-amber-400 shadow-sm';
            tokenText = 'text-amber-800';
        }

            <div className={`relative flex flex-col items-center justify-center transition-all duration-200 ${isSelected ? 'scale-110 z-50' : 'scale-100 z-10'}`}>

    const FieldView = memo(({ players, selectedId, onSlotClick, formation }) => {

                    {Object.entries(positions).map(([key, coords]) => {
                        const player = players.find(p => p.pos === key && p.present);

                                key={key}

                            >

                                    <PlayerToken
                                        name={player.name}
                                        initials={getInitials(player.name)}
                                        goals={player.goals}
                                        isSelected={isSelected}
                                        role={coords.type}
                                    />
                                ) : (
                                    <div className={`w-12 h-12 rounded-full border-2 border-dashed flex items-center justify-center transition-colors ${selectedId ? 'bg-white/30 border-white animate-pulse' : 'border-white/40 hover:bg-white/10'}`}>
                                        <span className="text-[10px] font-bold text-white/60">{coords.label}</span>
                                    </div>
                                )}
                            </div>
                        );
                    })}
                </div>
            </div>
        );
    });

    const StatsView = memo(({ players, sortConfig, onChangeSort }) => {
        const sortedPlayers = useMemo(() => {
            const list = [...players].filter(p => p.present);
            if (!sortConfig.key) return list;
            return list.sort((a, b) => {
                if (sortConfig.key === 'name') {
                    return sortConfig.direction === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name);
                }
                const aVal = a[sortConfig.key];
                const bVal = b[sortConfig.key];
                if (aVal === bVal) return 0;
                const cmp = aVal > bVal ? 1 : -1;
                return sortConfig.direction === 'asc' ? cmp : -cmp;
            });
        }, [players, sortConfig]);

        return (
            <div className="absolute inset-0 overflow-y-auto p-4 max-w-md mx-auto">
                <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Live Statistieken</h2>
                <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm mb-4">
                    <table className="w-full text-sm text-left">
                        <thead className="bg-slate-50 text-slate-500 text-[10px] uppercase font-bold border-b border-slate-200">
                            <tr>
                                <th className="p-3 pl-4 cursor-pointer hover:bg-slate-100 transition-colors" onClick={() => onChangeSort('name', 'asc')}>Naam</th>
                                <th className="p-3 text-center cursor-pointer hover:bg-slate-100 transition-colors" onClick={() => onChangeSort('goals', 'desc')}>Goal</th>
                                <th className="p-3 text-right cursor-pointer hover:bg-slate-100 transition-colors" onClick={() => onChangeSort('benchTime', 'desc')}>Bank</th>
                                <th className="p-3 pr-4 text-right cursor-pointer hover:bg-slate-100 transition-colors" onClick={() => onChangeSort('playTime', 'desc')}>Veld</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 text-slate-700">
                            {sortedPlayers.map(p => {
                                const stats = p.posStats || { k:0, def:0, mid:0, att:0 };
                                const totalPosTime = stats.k + stats.def + stats.mid + stats.att;
                                
                                return (
                                <tr key={p.id} className="hover:bg-slate-50 transition-colors">
                                    <td className="p-3 pl-4">
                                        <div className="font-medium">{p.name}</div>
                                        {totalPosTime > 0 && (
                                            <div className="flex w-full max-w-[80px] h-1.5 mt-1.5 rounded-full overflow-hidden bg-slate-100">
                                                {stats.k > 0 && <div style={{width: `${(stats.k/totalPosTime)*100}%`}} className="bg-yellow-400" title="Keeper" />}
                                                {stats.def > 0 && <div style={{width: `${(stats.def/totalPosTime)*100}%`}} className="bg-blue-400" title="Verdediging" />}
                                                {stats.mid > 0 && <div style={{width: `${(stats.mid/totalPosTime)*100}%`}} className="bg-emerald-400" title="Middenveld" />}
                                                {stats.att > 0 && <div style={{width: `${(stats.att/totalPosTime)*100}%`}} className="bg-red-400" title="Aanval" />}
                                            </div>
                                        )}
                                    </td>
                                    <td className={`text-center font-bold align-top pt-3 ${p.goals > 0 ? 'text-amber-500' : 'text-slate-300'}`}>{p.goals || '-'}</td>
                                    <td className={`text-right font-mono align-top pt-3 ${p.pos === null ? 'text-orange-500 font-bold' : ''}`}>{formatTime(p.benchTime)}</td>
                                    <td className="text-right pr-4 font-mono text-slate-400 align-top pt-3">{formatTime(p.playTime)}</td>
                                </tr>
                            )})}
                        </tbody>
                    </table>
                </div>
                
                <div className="flex gap-4 text-[10px] text-slate-500 justify-center bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                    <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-yellow-400"></span>Keeper</span>
                    <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-blue-400"></span>Verd.</span>
                    <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-emerald-400"></span>Midden</span>
                    <span className="flex items-center gap-1.5"><span className="w-2 h-2 rounded-full bg-red-400"></span>Aanval</span>
                </div>
            </div>
        );
    });

    const SetupView = memo(({ players, opponent, formation, onFormationChange, onOpponentNameChange, onOpponentColorChange, onRemovePlayer, onChangePlayerName, onTogglePresence, onCopyReport, onResetMatch, onFactoryReset, onAddPlayer, onExportData, onImportData }) => (
        <div className="absolute inset-0 overflow-y-auto p-4 max-w-md mx-auto bg-slate-50 z-20">
            <h2 className="text-xl font-bold mb-4 flex items-center gap-2 text-slate-800">
                <Icons.Settings size={22} /> Instellingen
            </h2>
            
            <div className="bg-white border border-slate-200 rounded-2xl p-5 mb-6 shadow-sm">
                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2"><Icons.Swords size={14} /> Wedstrijd Info</h3>
                <div className="space-y-5">
                    
                    <div>
                        <label className="text-xs font-semibold text-slate-600 block mb-2 flex items-center gap-1.5">
                            <Icons.Layout size={14} /> Formatie
                        </label>
                        <div className="grid grid-cols-3 gap-2">
                            {Object.entries(FORMATIONS).map(([key, data]) => (
                                <button
                                    key={key}
                                    onClick={() => onFormationChange(key)}
                                    className={`py-2 px-1 rounded-lg text-[10px] font-bold uppercase transition-all border ${
                                        formation === key
                                            ? 'bg-indigo-50 border-indigo-500 text-indigo-700 shadow-sm ring-1 ring-indigo-500'
                                            : 'bg-white border-slate-200 text-slate-500 hover:border-slate-300'
                                    }`}
                                >
                                    {key}
                                </button>
                            ))}
                        </div>
                        <p className="text-[10px] text-slate-400 mt-2 text-center">
                            {FORMATIONS[formation].label}
                        </p>
                    </div>

                    <div>
                        <label className="text-xs font-semibold text-slate-600 block mb-1.5">Naam Tegenstander</label>
                        <input value={opponent.name} onChange={e => onOpponentNameChange(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2.5 text-slate-800 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition-all" placeholder="Bijv. VV Katwijk" />
                    </div>
                    <div>
                        <label className="text-xs font-semibold text-slate-600 block mb-2 flex items-center gap-1.5"><Icons.Palette size={14} /> Shirt Kleur</label>
                        <div className="flex gap-3 flex-wrap">
                            {TEAM_COLORS.map(c => (
                                <button key={c.id} onClick={() => onOpponentColorChange(c.id)} className={`w-8 h-8 rounded-full ${c.bg} shadow-sm border-2 ${opponent.colorId === c.id ? 'border-slate-800 scale-110' : 'border-transparent opacity-60 hover:opacity-100'} transition-all`} title={c.id} />
                            ))}
                        </div>
                    </div>
                </div>
            </div>

            <div className="bg-white border border-slate-200 rounded-2xl p-5 mb-6 shadow-sm">
                <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2"><Icons.Users size={14} /> Spelers ({players.filter(p => p.present).length}/{players.length})</h3>
                <div className="space-y-2">
                    {players.map(p => (
                        <div key={p.id} className="bg-slate-50 border border-slate-100 p-2 rounded-xl flex items-center gap-2 transition-colors focus-within:border-indigo-200 focus-within:bg-indigo-50/30">
                            <button onClick={() => onRemovePlayer(p.id)} className="w-8 h-8 text-slate-400 rounded-lg hover:bg-red-50 hover:text-red-500 flex items-center justify-center transition-colors"><Icons.X size={16} /></button>
                            <input value={p.name} onChange={e => onChangePlayerName(p.id, e.target.value)} className="bg-transparent flex-1 px-2 py-1 font-medium text-slate-700 focus:outline-none" />
                            <button onClick={() => onTogglePresence(p.id)} className={`text-[10px] font-bold px-3 py-1.5 rounded-lg uppercase transition-all shadow-sm ${p.present ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-500'}`}>{p.present ? 'Aanwezig' : 'Afwezig'}</button>
                        </div>
                    ))}
                    <button onClick={onAddPlayer} className="w-full py-3 mt-2 border-2 border-dashed border-slate-200 text-slate-500 font-medium rounded-xl hover:border-indigo-300 hover:text-indigo-600 hover:bg-indigo-50 transition-colors flex items-center justify-center gap-2"><Icons.Plus size={16} /> Speler Toevoegen</button>
                </div>
            </div>
            
            <div className="space-y-3 pb-8">
                <button onClick={onCopyReport} className="w-full bg-emerald-500 hover:bg-emerald-600 py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 text-white shadow-sm transition-colors"><Icons.ClipboardCheck size={18} /> Kopieer Verslag</button>
                <button onClick={onResetMatch} className="w-full bg-slate-800 hover:bg-slate-900 py-3.5 rounded-xl font-bold flex items-center justify-center gap-2 text-white shadow-sm transition-colors"><Icons.RotateCcw size={18} /> Reset Huidige Wedstrijd</button>
                
                <div className="flex gap-3">
                    <button onClick={onExportData} className="flex-1 bg-slate-100 hover:bg-slate-200 border border-slate-200 py-3 rounded-xl font-bold flex items-center justify-center gap-2 text-slate-600 text-xs uppercase transition-colors">
                        <Icons.Save size={16} /> Backup
                    </button>
                    <label className="flex-1 bg-slate-100 hover:bg-slate-200 border border-slate-200 py-3 rounded-xl font-bold flex items-center justify-center gap-2 text-slate-600 text-xs uppercase cursor-pointer transition-colors">
                        <Icons.Upload size={16} /> Laad in
                        <input type="file" accept=".json" onChange={onImportData} className="hidden" />
                    </label>
                </div>

                <button onClick={onFactoryReset} className="w-full text-red-500 hover:bg-red-50 py-3 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 mt-4 transition-colors"><Icons.AlertTriangle size={14} /> Totale Fabrieksreset</button>
                
                {/* Zichtbaar Versienummer */}
                <div className="mt-8 text-center text-[10px] text-slate-400 font-mono flex items-center justify-center gap-1">
                    <Icons.Settings size={10} /> Versie: {APP_VERSION}
                </div>
            </div>
        </div>
    ));

    const ConfettiExplosion = memo(() => {
        const particles = useMemo(() => Array.from({ length: 50 }).map((_, i) => ({
            id: i,
            left: Math.random() * 100 + '%',
            bg: ['#EF4444', '#3B82F6', '#F59E0B', '#10B981', '#6366F1'][Math.floor(Math.random() * 5)],
            delay: Math.random() * 0.5 + 's',
            duration: (Math.random() * 1 + 2) + 's',
            rotation: Math.random() * 360 + 'deg',
        })), []);
        return (
            <div className="absolute inset-0 pointer-events-none overflow-hidden z-[100]">
                {particles.map(p => (
                    <div key={p.id} className="absolute w-2.5 h-2.5 rounded-sm shadow-sm" style={{ left: p.left, top: '-20px', backgroundColor: p.bg, animation: `fall ${p.duration} linear forwards`, animationDelay: p.delay, transform: `rotate(${p.rotation})` }} />
                ))}
            </div>
        );
    });

    // --------------------------------------------------------------------
    // HOOFDAPP
    // --------------------------------------------------------------------

    function App() {
        const [players, setPlayers] = useThrottledStorage(`${STORAGE_VERSION}_players`, getFreshPlayers(), 5000);
        const [timer, setTimer] = useThrottledStorage(`${STORAGE_VERSION}_timer`, 0, 5000);
        const [history, setHistory] = useThrottledStorage(`${STORAGE_VERSION}_history`, [], 5000);
        const [score, setScore] = useThrottledStorage(`${STORAGE_VERSION}_score`, { home: 0, away: 0 }, 5000);
        const [quarter, setQuarter] = useThrottledStorage(`${STORAGE_VERSION}_quarter`, 1, 5000);
        const [formation, setFormation] = useThrottledStorage(`${STORAGE_VERSION}_formation`, '6v6', 5000);
        
        const [archive, setArchive] = useState(() => { try { return JSON.parse(localStorage.getItem(`${STORAGE_VERSION}_archive`) || '[]'); } catch { return []; }});
        const [opponent, setOpponent] = useState(() => { try { return JSON.parse(localStorage.getItem(`${STORAGE_VERSION}_opponent`) || JSON.stringify({ name: 'Tegenstander', colorId: 'blue' })); } catch { return { name: 'Tegenstander', colorId: 'blue' }; }});

        const [isRunning, setIsRunning] = useState(false);
        const [selectedId, setSelectedId] = useState(null);
        const [view, setView] = useState('field');
        const [sortConfig, setSortConfig] = useState({ key: 'id', direction: 'asc' });

        const [showGoalModal, setShowGoalModal] = useState(false);
        const [showUndoGoalModal, setShowUndoGoalModal] = useState(false);
        const [showEndModal, setShowEndModal] = useState(false);
        const [showConfetti, setShowConfetti] = useState(false);
        const [confirmDialog, setConfirmDialog] = useState(null);

        useWakeLock(isRunning);

        useEffect(() => localStorage.setItem(`${STORAGE_VERSION}_archive`, JSON.stringify(archive)), [archive]);
        useEffect(() => localStorage.setItem(`${STORAGE_VERSION}_opponent`, JSON.stringify(opponent)), [opponent]);

        const safeOpponent = opponent || { name: 'Tegenstander', colorId: 'blue' };
        const oppColor = TEAM_COLORS.find(c => c.id === safeOpponent.colorId) || TEAM_COLORS[0];
        
        const currentPositions = FORMATIONS[formation].positions;

        const handleOpponentNameChange = useCallback((n) => setOpponent(o => ({ ...o, name: n })), [setOpponent]);
        const handleOpponentColorChange = useCallback((c) => setOpponent(o => ({ ...o, colorId: c })), [setOpponent]);
        const handleRemovePlayer = useCallback((id) => setConfirmDialog({ message: 'Weet je zeker dat je deze speler wilt wissen?', onConfirm: () => setPlayers(curr => curr.filter(p => p.id !== id)) }), [setPlayers]);
        const handleChangePlayerName = useCallback((id, n) => setPlayers(curr => curr.map(p => p.id === id ? { ...p, name: n } : p)), [setPlayers]);
        const handleTogglePresence = useCallback((id) => setPlayers(curr => curr.map(p => p.id === id ? { ...p, present: !p.present, pos: !p.present ? p.pos : null } : p)), [setPlayers]);
        const handleAddPlayer = useCallback(() => setPlayers(curr => [...curr, { id: Date.now(), name: 'Nieuw', pos: null, benchTime: 0, playTime: 0, benchCount: 0, goals: 0, present: true, posStats: {k:0,def:0,mid:0,att:0} }]), [setPlayers]);
        
        const handleFormationChange = useCallback((newFormat) => {
            setFormation(newFormat);
            const newPositions = FORMATIONS[newFormat].positions;
            setPlayers(curr => curr.map(p => {
                if (p.pos && !newPositions[p.pos]) {
                    return { ...p, pos: null };
                }
                return p;
            }));
        }, [setFormation, setPlayers]);

        const handleExportData = useCallback(() => {
            const backupData = {
                version: STORAGE_VERSION,
                date: new Date().toISOString(),
                data: { players, archive, opponent, history, score, quarter, formation }
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `coach_app_backup_${new Date().toLocaleDateString('nl-NL')}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }, [players, archive, opponent, history, score, quarter, formation]);

        const handleImportData = useCallback((e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (imported && imported.data) {
                        if (confirm('Let op: Dit overschrijft je huidige status met de data uit de backup. Doorgaan?')) {
                            if (imported.data.players) setPlayers(imported.data.players);
                            if (imported.data.archive) setArchive(imported.data.archive);
                            if (imported.data.opponent) setOpponent(imported.data.opponent);
                            if (imported.data.history) setHistory(imported.data.history);
                            if (imported.data.score) setScore(imported.data.score);
                            if (imported.data.quarter) setQuarter(imported.data.quarter);
                            if (imported.data.formation) setFormation(imported.data.formation);
                            alert("Backup succesvol hersteld!");
                        }
                    } else {
                        alert("Ongeldig backup bestand (verkeerd formaat).");
                    }
                } catch (err) {
                    alert("Fout bij het inladen van bestand.");
                }
            };
            reader.readAsText(file);
        }, [setPlayers, setArchive, setOpponent, setHistory, setScore, setQuarter, setFormation]);

        const handleInteraction = useCallback((targetId, targetPos = null) => {
            if (selectedId === null) {
                if (targetId) setSelectedId(targetId);
                return;
            }
            if (selectedId === targetId) {
                setSelectedId(null);
                return;
            }

            setPlayers(currentPlayers => {
                const p1Idx = currentPlayers.findIndex(p => p.id === selectedId);
                if (p1Idx === -1) return currentPlayers;

                const newPlayers = [...currentPlayers];
                if (!targetId && targetPos) {
                    newPlayers[p1Idx] = { ...newPlayers[p1Idx], pos: targetPos };
                    return newPlayers;
                }

                const p2Idx = currentPlayers.findIndex(p => p.id === targetId);
                if (p2Idx === -1) return currentPlayers;

                const p1 = newPlayers[p1Idx];
                const p2 = newPlayers[p2Idx];

                const tmpPos = p1.pos;
                newPlayers[p1Idx] = { ...p1, pos: p2.pos };
                newPlayers[p2Idx] = { ...p2, pos: tmpPos };
                
                return newPlayers;
            });

            const p1 = players.find(p => p.id === selectedId);
            const p2 = players.find(p => p.id === targetId);
            
            if (p1 && p2 && ((p1.pos === null && p2.pos !== null) || (p1.pos !== null && p2.pos === null))) {
                 if (isRunning || quarter > 1) { 
                    const outP = p1.pos !== null ? p1 : p2;
                    const inP = p1.pos === null ? p1 : p2;
                    setHistory(h => [{ id: Date.now(), time: formatTime(timer), q: quarter, in: inP.name, out: outP.name }, ...h]);
                    setPlayers(curr => curr.map(p => p.id === outP.id ? { ...p, benchCount: p.benchCount + 1 } : p));
                 }
            } else if (!targetId && targetPos) {
                setSelectedId(null);
                return;
            }
            setSelectedId(null);
        }, [selectedId, players, isRunning, quarter, timer, setPlayers, setHistory]);

        useEffect(() => {
            if (!isRunning) return;
            const interval = setInterval(() => {
                setTimer(t => t + 1);
                setPlayers(curr => curr.map(p => {
                    if (!p.present) return p;
                    if (p.pos === null) return { ...p, benchTime: p.benchTime + 1 };
                    
                    const posInfo = currentPositions[p.pos];
                    if (!posInfo) return p;

                    const posType = posInfo.type || 'mid';
                    const stats = p.posStats || { k:0, def:0, mid:0, att:0 };
                    return { 
                        ...p, 
                        playTime: p.playTime + 1,
                        posStats: { ...stats, [posType]: stats[posType] + 1 }
                    };
                }));
            }, 1000);
            return () => clearInterval(interval);
        }, [isRunning, setTimer, setPlayers, currentPositions]);

        useEffect(() => {
            if (showConfetti) {
                const t = setTimeout(() => setShowConfetti(false), 3000);
                return () => clearTimeout(t);
            }
        }, [showConfetti]);

        const toggleTimer = useCallback(() => {
            if (!isRunning && timer === 0 && quarter === 1) {
                setPlayers(prev => prev.map(p => p.pos === null && p.present ? { ...p, benchCount: p.benchCount + 1 } : p));
            }
            setIsRunning(prev => !prev);
        }, [isRunning, timer, quarter, setPlayers]);

        const registerGoal = (playerId) => {
            setScore(s => ({ ...s, home: s.home + 1 }));
            if (playerId) setPlayers(curr => curr.map(p => p.id === playerId ? { ...p, goals: p.goals + 1 } : p));
            setShowGoalModal(false);
            setShowConfetti(true);
        };

        const removeGoal = (playerId) => {
            setScore(s => ({ ...s, home: Math.max(0, s.home - 1) }));
            if (playerId) setPlayers(curr => curr.map(p => p.id === playerId ? { ...p, goals: Math.max(0, p.goals - 1) } : p));
            setShowUndoGoalModal(false);
        };

        const copyReport = () => {
            let resultText = 'Gelijkspel 🤝';
            if (score.home > score.away) resultText = 'Winst! 🏆';
            else if (score.home < score.away) resultText = 'Helaas..';
            const scorers = getScorers(players).map(p => `${p.name} (${p.goals}x)`).join(', ');
            const report = `⚽ *WEDSTRIJDVERSLAG JO9-10* ⚽\n\n🆚 Tegen: ${safeOpponent.name}\n📊 *Eindstand:* ${score.home} - ${score.away} (${resultText})\n\n🎯 *Doelpunten:* ${scorers || 'Geen'}\n\nToppers! 💪`;
            navigator.clipboard.writeText(report).then(() => alert('Gekopieerd!')).catch(() => prompt('Kopieer handmatig:', report));
        };

        const performReset = useCallback(() => {
            setIsRunning(false);
            setScore({ home: 0, away: 0 });
            setTimer(0);
            setQuarter(1);
            setHistory([]);
            setOpponent({ name: 'Tegenstander', colorId: 'blue' }); 
            setPlayers(curr => curr.map(p => ({ 
                ...p, 
                goals: 0, 
                benchTime: 0, 
                playTime: 0, 
                benchCount: 0, 
                posStats: { k:0, def:0, mid:0, att:0 } 
            })));
            setSelectedId(null);
        }, [setPlayers, setScore, setTimer, setQuarter, setHistory, setOpponent]);

        const resetMatch = () => {
            setConfirmDialog({
                message: '⚠ Let op: Je wist hiermee ALLES van DEZE wedstrijd (ook de tegenstander). Het seizoensarchief blijft wel bewaard.',
                isDestructive: true,
                onConfirm: () => performReset()
            });
        };

        const factoryReset = () => {
            setConfirmDialog({
                message: '☠️ FABRIEKSINSTELLINGEN ☠️\n\nWeet je dit heel zeker? Alle spelers, instellingen en de volledige historie worden onherroepelijk gewist.',
                isDestructive: true,
                onConfirm: () => { localStorage.clear(); location.reload(); }
            });
        };
        
        const archiveMatch = () => {
             setConfirmDialog({
                 message: '💾 Wedstrijd succesvol afronden, opslaan in het archief en het veld resetten voor de volgende keer?',
                 onConfirm: () => {
                     const matchData = {
                        id: Date.now(),
                        date: new Date().toLocaleDateString('nl-NL'),
                        opponent: safeOpponent.name,
                        score,
                        colorId: safeOpponent.colorId,
                        playerStats: players.map(p => ({ name: p.name, goals: p.goals, playTime: p.playTime, posStats: p.posStats }))
                    };
                    setArchive(prev => [matchData, ...prev]);
                    performReset(); 
                    setShowEndModal(false);
                    setView('season');
                 }
             });
        };

        const benchPlayers = getBench(players);

        return (
            // De wrapper is lichter gemaakt (bg-slate-50) en de veilige zone voor de Notch/Dynamic Island is toegevoegd aan de top (paddingTop)
            <div className="flex flex-col h-full w-full max-w-md mx-auto relative bg-slate-50 shadow-2xl" style={{ paddingTop: 'env(safe-area-inset-top)', paddingBottom: 'env(safe-area-inset-bottom)' }}>
                {showConfetti && <ConfettiExplosion />}

                {/* MODALS (Light Mode) */}
                {(showGoalModal || showUndoGoalModal || showEndModal || confirmDialog) && (
                    <div className="absolute inset-0 z-[60] bg-slate-900/40 flex items-center justify-center p-4 backdrop-blur-sm animate-[fadeIn_0.2s]">
                        <div className="bg-white rounded-3xl shadow-2xl w-full p-6 border border-slate-100">
                            {showGoalModal && (
                                <>
                                    <h3 className="text-3xl font-black text-center mb-6 text-emerald-500 uppercase tracking-wider font-mono">Goal! ⚽</h3>
                                    <div className="grid grid-cols-2 gap-3 mb-4 max-h-[50vh] overflow-y-auto">
                                        {getField(players).map(p => (
                                            <button key={p.id} onClick={() => registerGoal(p.id)} className="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold py-4 rounded-xl border border-emerald-200 active:scale-95 transition-all">{p.name}</button>
                                        ))}
                                    </div>
                                    <button onClick={() => registerGoal(null)} className="w-full bg-slate-100 hover:bg-slate-200 py-3 rounded-xl font-bold mb-2 text-slate-700 transition-colors">Overig / Eigen Goal</button>
                                    <button onClick={() => setShowGoalModal(false)} className="w-full text-slate-400 font-medium text-sm py-2 hover:text-slate-600 transition-colors">Annuleren</button>
                                </>
                            )}
                            {showUndoGoalModal && (
                                <>
                                    <h3 className="text-xl font-bold text-center mb-4 text-red-500">Goal Correctie</h3>
                                    <div className="grid grid-cols-2 gap-3 mb-4">
                                        {getScorers(players).map(p => (
                                            <button key={p.id} onClick={() => removeGoal(p.id)} className="bg-red-50 hover:bg-red-100 text-red-600 py-3 border border-red-200 rounded-xl font-bold transition-colors">{p.name} ({p.goals})</button>
                                        ))}
                                    </div>
                                    <button onClick={() => removeGoal(null)} className="w-full bg-slate-100 hover:bg-slate-200 py-3 rounded-xl font-bold mb-2 text-slate-700 transition-colors">Overig</button>
                                    <button onClick={() => setShowUndoGoalModal(false)} className="w-full text-slate-400 font-medium text-sm py-2 hover:text-slate-600 transition-colors">Annuleren</button>
                                </>
                            )}
                            {showEndModal && (
                                <div className="text-center">
                                    <h2 className="text-2xl font-black text-slate-800 mb-1 uppercase">Wedstrijd Einde</h2>
                                    <div className="text-md text-slate-500 mb-6 font-medium">vs {safeOpponent.name}</div>
                                    <div className="text-6xl font-mono font-bold mb-8 tracking-widest bg-slate-50 text-slate-800 rounded-2xl py-5 border border-slate-100 shadow-inner">{score.home} - {score.away}</div>
                                    <button onClick={copyReport} className="w-full py-4 bg-emerald-500 text-white rounded-xl font-bold shadow-sm mb-3 flex items-center justify-center gap-2 text-lg hover:bg-emerald-600 transition-colors"><Icons.ClipboardCheck /> Verslag Kopiëren</button>
                                    <button onClick={archiveMatch} className="w-full py-4 bg-indigo-500 text-white rounded-xl font-bold shadow-sm mb-3 flex items-center justify-center gap-2 text-lg hover:bg-indigo-600 transition-colors"><Icons.Save /> Opslaan & Archiveren</button>
                                    <button onClick={() => setShowEndModal(false)} className="w-full py-3 bg-white border border-slate-200 rounded-xl text-slate-500 font-semibold hover:bg-slate-50 transition-colors">Terug naar Veld</button>
                                </div>
                            )}
                            {confirmDialog && (
                                <div className="text-center">
                                    <h3 className={`text-xl font-bold mb-4 ${confirmDialog.isDestructive ? 'text-red-500' : 'text-slate-800'}`}>Bevestiging</h3>
                                    <p className="text-slate-600 mb-8 text-sm font-medium whitespace-pre-line leading-relaxed">{confirmDialog.message}</p>
                                    <div className="flex gap-3">
                                        <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog(null); }} className={`flex-1 py-3.5 rounded-xl font-bold text-white transition-colors shadow-sm ${confirmDialog.isDestructive ? 'bg-red-500 hover:bg-red-600' : 'bg-indigo-500 hover:bg-indigo-600'}`}>Ja, doorgaan</button>
                                        <button onClick={() => setConfirmDialog(null)} className="flex-1 py-3.5 bg-slate-100 text-slate-700 rounded-xl font-bold hover:bg-slate-200 transition-colors">Annuleren</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                )}

                {/* TOPBAR (Licht Thema + Ruimte voor Notch is nu in de main div gefixt) */}
                <div className="flex-none h-20 bg-white/95 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-4 z-50">
                    <div className="flex flex-col w-20">
                        <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Kwart {quarter}</span>
                        {/* bg-white toegevoegd in de rode status om de iOS Safari 'ghosting' bug te blokkeren */}
                        <div className={`text-2xl font-mono font-bold leading-none py-0.5 -ml-1 px-1 rounded-md ${timer >= 600 ? 'text-red-500 bg-white animate-pulse' : 'text-slate-800'}`}>{formatTime(timer)}</div>
                    </div>
                    <div className="flex-1 flex flex-col items-center justify-center">
                        <div className="flex items-center bg-slate-50 rounded-full border border-slate-200 px-2 py-1 shadow-sm">
                            <div className="flex items-center gap-1">
                                <button onClick={() => score.home > 0 && setShowUndoGoalModal(true)} className="w-8 h-8 rounded-full bg-white border border-slate-200 text-slate-400 hover:text-red-500 flex items-center justify-center font-bold active:scale-90 transition-transform"><Icons.Minus size={14} /></button>
                                <span className="w-8 text-center text-2xl font-black text-slate-800 font-mono">{score.home}</span>
                                <button onClick={() => setShowGoalModal(true)} className="w-8 h-8 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold shadow-sm active:scale-90 transition-transform"><Icons.Plus size={16} /></button>
                            </div>
                            <span className="text-slate-300 mx-2 text-xl font-light">|</span>
                            <div className="flex items-center gap-1">
                                <button onClick={() => setScore(s => ({ ...s, away: Math.max(0, s.away - 1) }))} className={`w-8 h-8 rounded-full bg-white border border-slate-200 text-slate-400 hover:${oppColor.text} flex items-center justify-center font-bold active:scale-90 transition-transform`}><Icons.Minus size={14} /></button>
                                <span className={`w-8 text-center text-2xl font-black ${oppColor.text} font-mono`}>{score.away}</span>
                                <button onClick={() => setScore(s => ({ ...s, away: s.away + 1 }))} className={`w-8 h-8 rounded-full ${oppColor.bg} text-white flex items-center justify-center font-bold shadow-sm active:scale-90 transition-transform`}><Icons.Plus size={16} /></button>
                            </div>
                        </div>
                        <div className="mt-1.5 text-[10px] text-slate-500 font-semibold truncate max-w-[220px] text-center">Nieuwerkerk <span className="text-slate-300 mx-1 font-normal">vs</span> {safeOpponent.name}</div>
                    </div>
                    <div className="w-20 flex justify-end">
                        <button onClick={() => setView(prev => (prev === 'setup' ? 'field' : 'setup'))} className={`p-2 rounded-xl border transition-colors ${view === 'setup' ? 'bg-indigo-50 border-indigo-200 text-indigo-600' : 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50'}`}><Icons.Settings size={20} /></button>
                    </div>
                </div>

                {/* MAIN CONTENT */}
                <div className="flex-1 relative overflow-hidden bg-slate-50 w-full">
                    {view === 'field' && <FieldView players={players} selectedId={selectedId} onSlotClick={handleInteraction} formation={formation} />}
                    {view === 'stats' && <StatsView players={players} sortConfig={sortConfig} onChangeSort={setSortConfig} />}
                    
                    {view === 'log' && (
                        <div className="absolute inset-0 overflow-y-auto p-4 max-w-md mx-auto">
                             <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Wissel Logboek</h2>
                             <div className="space-y-2">{history.map(h => (
                                <div key={h.id} className="bg-white border border-slate-200 p-3.5 rounded-xl flex justify-between items-center text-slate-700 shadow-sm">
                                    <span className="text-[10px] font-mono font-bold text-slate-400 bg-slate-50 border border-slate-100 px-2 py-1 rounded-md">Q{h.q} {h.time}</span>
                                    <div className="text-sm font-medium"><span className="text-red-500">{h.out}</span> <span className="text-slate-300 mx-1">➜</span> <span className="text-emerald-500">{h.in}</span></div>
                                </div>
                             ))}</div>
                        </div>
                    )}
                    
                    {view === 'season' && (
                         <div className="absolute inset-0 overflow-y-auto p-4 max-w-md mx-auto">
                            <h2 className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">Archief ({archive.length})</h2>
                            <div className="space-y-3">
                                {archive.map(m => (
                                    <div key={m.id} className="bg-white p-4 rounded-2xl flex flex-col gap-2 border border-slate-200 shadow-sm">
                                        <div className="flex justify-between items-center"><span className="text-slate-400 font-medium text-xs">{m.date}</span><span className="text-sm font-bold text-slate-700">vs {m.opponent}</span></div>
                                        <div className="flex justify-between items-center mt-1">
                                            <span className="text-[10px] font-bold text-slate-400 uppercase bg-slate-50 px-2 py-1 rounded-lg">Uitslag</span>
                                            <span className={`font-mono font-black text-lg ${m.score.home > m.score.away ? 'text-emerald-500' : m.score.home < m.score.away ? 'text-red-500' : 'text-slate-500'}`}>{m.score.home} - {m.score.away}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                         </div>
                    )}

                    {view === 'setup' && (
                        <SetupView
                            players={players}
                            opponent={safeOpponent}
                            formation={formation}
                            onFormationChange={handleFormationChange}
                            onOpponentNameChange={handleOpponentNameChange}
                            onOpponentColorChange={handleOpponentColorChange}
                            onRemovePlayer={handleRemovePlayer}
                            onChangePlayerName={handleChangePlayerName}
                            onTogglePresence={handleTogglePresence}
                            onAddPlayer={handleAddPlayer}
                            onCopyReport={copyReport}
                            onResetMatch={resetMatch}
                            onFactoryReset={factoryReset}
                            onExportData={handleExportData}
                            onImportData={handleImportData}
                        />
                    )}
                </div>

                {/* FOOTER (Licht Thema) */}
                <div className="flex-none bg-white border-t border-slate-200 z-50">
                    {view !== 'setup' && (
                        <>
                            <div className="flex border-b border-slate-100">
                                {[{ id: 'field', label: 'Veld', icon: Icons.Trophy }, { id: 'stats', label: 'Stats', icon: Icons.ClipboardCheck }, { id: 'log', label: 'Log', icon: Icons.Clock }, { id: 'season', label: 'Seizoen', icon: Icons.History }].map(tab => (
                                    <button key={tab.id} onClick={() => setView(tab.id)} className={`flex-1 py-3.5 flex flex-col items-center justify-center gap-1 transition-colors ${view === tab.id ? 'text-indigo-600 bg-indigo-50/50 border-b-2 border-indigo-500' : 'text-slate-400 hover:text-slate-600 hover:bg-slate-50'}`}>
                                        <tab.icon size={18} /><span className="text-[9px] font-bold uppercase tracking-widest">{tab.label}</span>
                                    </button>
                                ))}
                            </div>
                            <div className="p-4 pt-3">
                                {view === 'season' ? (
                                    <div className="text-center text-xs font-medium text-slate-400 py-5">Archief Modus</div>
                                ) : (
                                    <>
                                        <div className="mb-2 px-1 flex justify-between items-end">
                                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Wisselbank ({benchPlayers.length})</span>
                                        </div>
                                        <div className="flex gap-4 overflow-x-auto pb-4 scrollbar-hide min-h-[80px]">
                                            {benchPlayers.length > 0 ? benchPlayers.map(p => (
                                                <div key={p.id} onClick={() => handleInteraction(p.id)} className="flex-shrink-0 cursor-pointer">
                                                    <PlayerToken name={p.name} initials={getInitials(p.name)} goals={p.goals} isSelected={p.id === selectedId} benchTime={p.benchTime} showBenchTimer />
                                                </div>
                                            )) : <div className="w-full text-center text-slate-400 font-medium text-xs py-4 border-2 border-dashed border-slate-200 rounded-xl">Iedereen staat in het veld!</div>}
                                        </div>
                                        <div className="flex gap-3 mt-1">
                                            <button onClick={toggleTimer} className={`flex-1 py-4 rounded-xl font-bold text-sm shadow-sm border flex items-center justify-center gap-2 transform active:scale-95 transition-all ${isRunning ? 'bg-white border-amber-200 text-amber-600 ring-2 ring-amber-100' : 'bg-emerald-500 border-emerald-500 text-white shadow-emerald-500/30 shadow-lg hover:bg-emerald-600'}`}>
                                                {isRunning ? <><Icons.Pause size={18} /> PAUZE</> : <><Icons.Play size={18} /> START</>}
                                            </button>
                                            <button onClick={() => {
                                                if (quarter === 4) {
                                                    setShowEndModal(true);
                                                } else {
                                                    setConfirmDialog({
                                                        message: `Volgend kwart (Kwart ${quarter + 1}) starten?\n\nDe tijd wordt gereset naar 00:00.`,
                                                        onConfirm: () => { setQuarter(q => q + 1); setTimer(0); setIsRunning(false); }
                                                    });
                                                }
                                            }} className={`px-6 py-3 rounded-xl font-bold text-[10px] shadow-sm flex flex-col items-center justify-center leading-none transform active:scale-95 transition-all border ${quarter === 4 ? 'bg-red-500 border-red-500 text-white animate-pulse' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}`}>
                                                {quarter === 4 ? <span className="text-xs">EINDE</span> : <><span className="mb-0.5"><Icons.FastForward size={14} /></span>KWART</>}
                                            </button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </>
                    )}
                </div>
            </div>
        );
    }
</script>

<script>
    window.addEventListener('load', function() {
        setTimeout(function() {
            try {
                const rawCode = document.getElementById('react-app-code').textContent;
                const compiledCode = Babel.transform(rawCode, { presets: ['react', 'env'] }).code;
                const runReactApp = new Function(compiledCode + '\nReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));');
                runReactApp();
            } catch (error) {
                const root = document.getElementById('root');
                if (root) {
                    root.innerHTML = '<div style="padding: 24px; padding-top: calc(env(safe-area-inset-top) + 24px); color: #dc2626; font-family: monospace; font-size: 13px; word-wrap: break-word; background-color: #f8fafc; height: 100vh;">' +
                        '<h3 style="font-weight: bold; font-size: 16px; margin-bottom: 8px;">Compilatiefout Babel</h3>' + 
                        (error.message || 'Onbekende fout tijdens vertalen code.') +
                        '<div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #e2e8f0;">' +
                        '<button onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload();" style="padding: 12px 20px; background: #ef4444; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; width: 100%;">Forceer Reset</button>' +
                        '</div></div>';
                }
                console.error("Babel error: ", error);
            }
        }, 150);
    });
</script>
</body>
</html>
